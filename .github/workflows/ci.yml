name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    # ExcelDNA produces a Windows .xll, so everything builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Headless unit tests of the add-in's own logic (validation, normalization, range
      # conversion). No Excel required -> runnable in CI. This also builds the add-in.
      - name: Unit tests + coverage
        run: dotnet test tests/Aleksej.Finance.Excel.UnitTests/Aleksej.Finance.Excel.UnitTests.csproj -c Release /p:Platform=x64 --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # The ExcelDna.Testing integration suite drives REAL Excel, so it can only RUN locally
      # (no Excel on hosted runners). We compile it here to catch breakage.
      - name: Compile-check the Excel integration suite
        run: dotnet build tests/Aleksej.Finance.Excel.Tests/Aleksej.Finance.Excel.Tests.csproj -c Release /p:Platform=x64

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./TestResults
          fail_ci_if_error: false
